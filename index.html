<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dubbo Fuel Pilot - Family Control</title>

    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 92vh;
        }
        .app-container { max-width: 500px; margin: 0 auto; width: 100%; }
        header {
            background-color: #1e293b;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        h1 { margin: 0; font-size: 14px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .sector-title { margin: 4px 0 0 0; font-size: 24px; font-weight: 800; color: #f59e0b; }
        .admin-toggle { background: none; border: none; font-size: 24px; cursor: pointer; }
        
        /* Station Cards */
        .station-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .best-card { border-color: #10b981; background-color: rgba(16, 185, 129, 0.1); }
        .station-name { margin: 0; font-size: 18px; font-weight: bold; }
        .station-details { margin: 4px 0 0 0; font-size: 14px; color: #94a3b8; }
        .price-tag { font-size: 28px; font-weight: 900; color: #f1f5f9; }
        .best-price { color: #10b981; }
        .cheapest-badge {
            background-color: #10b981;
            color: #0f172a;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-top: 4px;
            display: inline-block;
        }
        .map-btn {
            background-color: #0284c7;
            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 6px;
            margin-top: 8px;
            display: inline-block;
        }

        /* Admin Update Panel Layout */
        .admin-panel {
            background-color: #0f172a;
            border: 2px dashed #f59e0b;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
        }
        .admin-title { font-size: 16px; font-weight: bold; color: #f59e0b; margin-top: 0; margin-bottom: 12px; }
        .input-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .input-group label { font-size: 14px; font-weight: bold; }
        .price-input {
            width: 80px;
            background-color: #1e293b;
            border: 1px solid #475569;
            color: white;
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }
        .save-btn {
            width: 100%;
            background-color: #f59e0b;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        footer { text-align: center; font-size: 11px; color: #64748b; margin-top: auto; padding-top: 20px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div>
                <h1>Family Control (DIESEL)</h1>
                <p class="sector-title">DUBBO, NSW 2830</p>
            </div>
            <!-- Click the gear to show/hide the price update board -->
            <button class="admin-toggle" onclick="toggleAdmin()">⚙️</button>
        </header>

        <!-- Hidden Price Pad Panel -->
        <div id="adminPanel" class="admin-panel">
            <p class="admin-title">Fuel Desk: Update Pump Prices (¢)</p>
            <div id="adminInputs"></div>
            <button class="save-btn" onclick="savePrices()">💾 Save & Recalculate</button>
        </div>

        <!-- Live Station Cards Display -->
        <div id="fuelList"></div>

        <footer>
            🛠️ Tap the ⚙️ gear icon to manually sync active local board values.
        </footer>
    </div>

    <script>
        // Baseline default pricing array profiles
        const defaultStations = [
            { id: 0, name: "Shell Dubbo", address: "Whylandra St", price: 184.9 },
            { id: 1, name: "Ampol Foodary", address: "Erskine St", price: 189.9 },
            { id: 2, name: "BP Dubbo", address: "Mitchell Hwy", price: 191.9 },
            { id: 3, name: "Caltex Dubbo East", address: "Cobra St", price: 186.4 }
        ];

        let currentStations = [];

        window.onload = function() {
            // Check if user already has saved values in local storage, otherwise use defaults
            const saved = localStorage.getItem('dubbo_diesel_prices');
            if (saved) {
                currentStations = JSON.parse(saved);
            } else {
                currentStations = defaultStations;
            }
            buildAdminPanel();
            renderDashboard();
        };

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function buildAdminPanel() {
            const container = document.getElementById('adminInputs');
            container.innerHTML = "";
            currentStations.forEach(station => {
                const row = document.createElement('div');
                row.className = 'input-group';
                row.innerHTML = `
                    <label>${station.name}</label>
                    <input type="number" step="0.1" id="input-${station.id}" class="price-input" value="${station.price}">
                `;
                container.appendChild(row);
            });
        }

        function savePrices() {
            currentStations.forEach(station => {
                const inputVal = document.getElementById(`input-${station.id}`).value;
                station.price = parseFloat(inputVal) || station.price;
            });
            
            // Save the data to memory storage
            localStorage.setItem('dubbo_diesel_prices', JSON.stringify(currentStations));
            toggleAdmin(); // Close menu
            renderDashboard(); // Re-sort and render cards
        }

        function renderDashboard() {
            const listContainer = document.getElementById('fuelList');
            listContainer.innerHTML = "";

            // Sort data array so the absolute cheapest Diesel price sits on top
            let sortedStations = [...currentStations];
            sortedStations.sort((a, b) => a.price - b.price);
            
            const lowestPrice = sortedStations[0].price;

            sortedStations.forEach(station => {
                const isCheapest = station.price === lowestPrice;
                const card = document.createElement('div');
                card.className = `station-card ${isCheapest ? 'best-card' : ''}`;
                
                const mapQuery = encodeURIComponent(`${station.name} ${station.address} Dubbo NSW`);
                const mapLink = `https://google.com{mapQuery}`;
                
                card.innerHTML = `
                    <div>
                        <p class="station-name">${station.name}</p>
                        <p class="station-details">${station.address} • <strong>Diesel</strong></p>
                        <a href="${mapLink}" target="_blank" class="map-btn">🗺️ Route directions</a>
                    </div>
                    <div style="text-align: right;">
                        <span class="price-tag ${isCheapest ? 'best-price' : ''}">${station.price}¢</span>
                        <br>
                        ${isCheapest ? '<span class="cheapest-badge">Best Choice</span>' : ''}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
