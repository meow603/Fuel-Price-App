<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dubbo Fuel Pilot - Diesel</title>

    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <style>
        /* Ultra-lightweight styling that loads instantly */
        body { 
            background-color: #0f172a; 
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }
        header {
            background-color: #1e293b;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        h1 { margin: 0; font-size: 14px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .sector-title { margin: 4px 0 0 0; font-size: 24px; font-weight: 800; color: #f59e0b; }
        .refresh-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .station-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .best-card {
            border-color: #10b981;
            background-color: rgba(16, 185, 129, 0.1);
        }
        .station-name { margin: 0; font-size: 18px; font-weight: bold; }
        .station-details { margin: 4px 0 0 0; font-size: 14px; color: #94a3b8; }
        .price-tag { font-size: 28px; font-weight: 900; color: #f1f5f9; }
        .best-price { color: #10b981; }
        .cheapest-badge {
            background-color: #10b981;
            color: #0f172a;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-top: 4px;
            display: inline-block;
        }
        footer {
            text-align: center;
            font-size: 12px;
            color: #64748b;
            margin-top: auto;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div>
                <h1>Target Sector (DIESEL)</h1>
                <p class="sector-title">DUBBO, NSW 2830</p>
            </div>
            <button class="refresh-btn" onclick="fetchDubboFuel()">🔄</button>
        </header>

        <div id="fuelList">
            <div style="text-align: center; color: #94a3b8; padding: 40px 0;">Loading Diesel Data...</div>
        </div>

        <footer>
            ⚠️ Dashboard UI mode active. Do not operate while driving.
        </footer>
    </div>

    <script>
        window.onload = function() {
            fetchDubboFuel();
        };

        function fetchDubboFuel() {
            const listContainer = document.getElementById('fuelList');
            listContainer.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 40px 0;">Updating station dashboard...</div>`;

            // Updated Local Dubbo dataset tracking ONLY Diesel profiles
            const mockDubboStations = [
                { name: "Shell Dubbo", address: "Whylandra St", price: 186.9, type: "Diesel", best: true },
                { name: "Ampol Foodary", address: "Erskine St", price: 189.9, type: "Diesel", best: false },
                { name: "BP Dubbo", address: "Mitchell Hwy", price: 191.9, type: "Diesel", best: false },
                { name: "Caltex Dubbo East", address: "Cobra St", price: 188.4, type: "Diesel", best: false }
            ];

            listContainer.innerHTML = "";
            
            mockDubboStations.forEach(station => {
                const card = document.createElement('div');
                card.className = `station-card ${station.best ? 'best-card' : ''}`;
                
                card.innerHTML = `
                    <div>
                        <p class="station-name">${station.name}</p>
                        <p class="station-details">${station.address} • <strong>${station.type}</strong></p>
                    </div>
                    <div style="text-align: right;">
                        <span class="price-tag ${station.best ? 'best-price' : ''}">${station.price}¢</span>
                        <br>
                        ${station.best ? '<span class="cheapest-badge">Cheapest Diesel</span>' : ''}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
