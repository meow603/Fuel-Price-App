<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dubbo Fuel Pilot</title>

    <!-- RIGHT HERE: This is the script tag that connects your sw.js file -->
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
    <!-- End of script tag section -->

    <!-- Tailwind CSS for clean, high-contrast Car UI styling -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #0f172a; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between p-4">

    <!-- MAIN APP SCREEN (Opens Instantly) -->
    <div id="appScreen" class="flex-grow flex flex-col max-w-xl mx-auto w-full">
        <!-- Dashboard Header -->
        <header class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 mb-4">
            <div>
                <h1 class="text-lg font-bold text-slate-400 uppercase tracking-wider">Target Sector</h1>
                <p class="text-2xl font-extrabold text-emerald-400">DUBBO, NSW 2830</p>
            </div>
            <button onclick="fetchDubboFuel()" class="bg-slate-700 p-3 rounded-lg font-bold text-sm active:bg-slate-600 transition">
                🔄 REFRESH
            </button>
        </header>

        <!-- Price Feed List -->
        <main class="flex-grow space-y-3 overflow-y-auto max-h-[70vh]" id="fuelList">
            <!-- Loading State Placeholder -->
            <div class="text-center py-12 text-slate-400 animate-pulse">Connecting to NSW FuelCheck Feed...</div>
        </main>

        <!-- In-Car Safety Footer -->
        <footer class="mt-4 bg-slate-900 p-3 rounded-xl text-center border border-slate-800 text-xs text-slate-500">
            ⚠️ Dashboard UI mode active. Do not operate while driving.
        </footer>
    </div>

    <script>
        // Automatically fetch data when the website loads
        window.onload = function() {
            fetchDubboFuel();
        };

        // Logic framework that simulates parsing and filtering live station streams for Dubbo
        async function fetchDubboFuel() {
            const listContainer = document.getElementById('fuelList');
            listContainer.innerHTML = `<div class="text-center py-12 text-slate-400">Querying regional stations...</div>`;

            try {
                // Mock data set matching official NSW data profiles for the 2830 zone
                setTimeout(() => {
                    const mockDubboStations = [
                        { name: "Shell Dubbo", address: "Whylandra St", price: 184.9, type: "E10", best: true },
                        { name: "Ampol Foodary", address: "Erskine St", price: 189.9, type: "Unleaded 91", best: false },
                        { name: "BP Dubbo", address: "Mitchell Hwy", price: 191.9, type: "Diesel", best: false },
                        { name: "Caltex Dubbo East", address: "Cobra St", price: 186.4, type: "E10", best: false }
                    ];

                    listContainer.innerHTML = "";
                    
                    mockDubboStations.forEach(station => {
                        const stationCard = document.createElement('div');
                        stationCard.className = `p-5 rounded-xl border flex justify-between items-center transition ${
                            station.best ? 'bg-emerald-950/40 border-emerald-500' : 'bg-slate-800 border-slate-700'
                        }`;
                        
                        stationCard.innerHTML = `
                            <div>
                                <h3 class="text-xl font-bold text-white">${station.name}</h3>
                                <p class="text-sm text-slate-400">${station.address} • <span class="text-slate-300 font-medium">${station.type}</span></p>
                            </div>
                            <div class="text-right">
                                <span class="text-3xl font-black ${station.best ? 'text-emerald-400' : 'text-slate-200'}">${station.price}¢</span>
                                ${station.best ? '<div class="text-[10px] bg-emerald-500 text-slate-950 px-2 py-0.5 rounded font-black mt-1 uppercase tracking-wider">Cheapest</div>' : ''}
                            </div>
                        `;
                        listContainer.appendChild(stationCard);
                    });
                }, 500);

            } catch (error) {
                listContainer.innerHTML = `<div class="text-center py-12 text-red-400">Data Link Error. Retry.</div>`;
            }
        }
    </script>
</body>
</html>
<script>
  if (typeof navigator.serviceWorker !== 'undefined') {
    navigator.serviceWorker.register('sw.js')
  }
</script>
